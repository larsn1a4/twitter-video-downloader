services:
  x-downloader:
    build:
      context: .
      # Optional: bake your public URL into SEO metadata at build time
      # args:
      #   NEXT_PUBLIC_SITE_URL: https://dl.example.com
    ports:
      - "3000:3000"
    environment:
      # Or set it at runtime (used for sitemap/robots/canonical)
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://example.com}
    restart: unless-stopped
